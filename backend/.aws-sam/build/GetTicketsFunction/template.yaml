AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 30
    MemorySize: 128
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref TicketTable
        JWT_SECRET: dev_secret

  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization,authorization'"
      AllowOrigin: "'*'"

Resources:

  # ======================
  # DYNAMODB TABLE
  # ======================
  TicketTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TicketSystem
      BillingMode: PAY_PER_REQUEST

      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: sla_state
          AttributeType: S
        - AttributeName: sla_due_at
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: requester_id
          AttributeType: S
        - AttributeName: owner
          AttributeType: S

      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

      GlobalSecondaryIndexes:
        - IndexName: GSI_Status
          KeySchema:
            - AttributeName: status
              KeyType: HASH
          Projection:
            ProjectionType: ALL

        - IndexName: GSI_SLA_V2
          KeySchema:
            - AttributeName: sla_state
              KeyType: HASH
            - AttributeName: sla_due_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

        - IndexName: GSI_Requester
          KeySchema:
            - AttributeName: requester_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

        - IndexName: GSI_Owner
          KeySchema:
            - AttributeName: owner
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # ======================
  # SQS
  # ======================
  TriageDLQ:
    Type: AWS::SQS::Queue

  TriageQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 30
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt TriageDLQ.Arn
        maxReceiveCount: 3

  # ======================
  # LOGGING POLICY
  # ======================
  LambdaBasicLoggingPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: "*"

  # ======================
  # AUTH
  # ======================
  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/authRegister.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketTable
        - !Ref LambdaBasicLoggingPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /auth/register
            Method: POST

  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/authLogin.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TicketTable
        - !Ref LambdaBasicLoggingPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /auth/login
            Method: POST

  # ======================
  # CREATE TICKET
  # ======================
  CreateTicketFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/createTicket.handler
      Environment:
        Variables:
          QUEUE_URL: !Ref TriageQueue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketTable
        - SQSSendMessagePolicy:
            QueueName: !Ref TriageQueue
        - !Ref LambdaBasicLoggingPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /tickets
            Method: POST

  # ======================
  # GET ALL
  # ======================
  GetTicketsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/getTickets.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TicketTable
        - !Ref LambdaBasicLoggingPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /tickets
            Method: GET

  # ======================
  # GET BY ID
  # ======================
  GetTicketByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/getTicketById.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TicketTable
        - !Ref LambdaBasicLoggingPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /tickets/{id}
            Method: GET

  # ======================
  # UPDATE
  # ======================
  UpdateTicketFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/updateTicket.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketTable
        - !Ref LambdaBasicLoggingPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /tickets/{id}
            Method: PUT

  # ======================
  # DELETE
  # ======================
  DeleteTicketFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/deleteTicket.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketTable
        - !Ref LambdaBasicLoggingPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /tickets/{id}
            Method: DELETE

  # ======================
  # DASHBOARD
  # ======================
  DashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/dashboard.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TicketTable
        - !Ref LambdaBasicLoggingPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /dashboard
            Method: GET

  # ======================
  # SQS WORKER
  # ======================
  TriageWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/triageWorker.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketTable
        - SQSPollerPolicy:
            QueueName: !Ref TriageQueue
        - !Ref LambdaBasicLoggingPolicy
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt TriageQueue.Arn
            BatchSize: 5

  # ======================
  # STREAM
  # ======================
  SLAStreamFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/slaStream.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketTable
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:DescribeStream
              - dynamodb:GetRecords
              - dynamodb:GetShardIterator
              - dynamodb:ListStreams
            Resource: !GetAtt TicketTable.StreamArn
        - !Ref LambdaBasicLoggingPolicy
      Events:
        Stream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt TicketTable.StreamArn
            StartingPosition: LATEST

  # ======================
  # CRON
  # ======================
  SLACronFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/slaCron.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketTable
        - !Ref LambdaBasicLoggingPolicy
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)

Outputs:
  ApiUrl:
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"